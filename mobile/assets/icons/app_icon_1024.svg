  <rect x="456" y="272" width="112" height="480" rx="16" fill="#FFFFFF"/>
  <rect x="488" y="304" width="48" height="40" rx="8" fill="#14B8A6"/>
  <rect x="488" y="376" width="48" height="40" rx="8" fill="#2563EB"/>
